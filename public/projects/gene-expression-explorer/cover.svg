    <rect x="535" y="169" width="42" height="32" fill="#1e293b"/><rect x="577" y="169" width="42" height="32" fill="#0284c7"/><rect x="619" y="169" width="42" height="32" fill="#14b8a6"/><rect x="661" y="169" width="42" height="32" fill="#2dd4bf"/>
